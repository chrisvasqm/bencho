server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # style-src needs 'unsafe-inline': sonner injects its stylesheet as a <style> element at runtime.
  # The script hash is the inline theme script in index.html; recompute it when that script changes.
  set $csp "default-src 'self'; script-src 'self' 'sha256-rKMwo/1ufp2lm24aAUo5uXVdwLsVkGsjDKbpqnbzl7g='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'";

  # add_header in a location replaces the server-level ones, so each location sets all of them.
  location /api/ {
    # Resolve at request time so a recreated backend container (new IP) keeps working.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # Vite fingerprints everything under /assets, so it can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /index.html;
  }
}
