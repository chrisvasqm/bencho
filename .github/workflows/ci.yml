# Full checks and test suites of both projects on every pull request.
# `ci` is the one job to mark as required in branch protection.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a PR run; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PNPM_VERSION: 11.22.0
  NODE_VERSION: 24
  # Same k6 as the backend image (backend/Dockerfile).
  K6_VERSION: 2.2.0

jobs:
  backend:
    name: backend (check + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start test Postgres, QuickPizza and the SOAP demo
        run: |
          docker compose -p perf-test --profile test up -d --wait postgres-test
          docker compose up -d quickpizza soap-demo
          for url in http://localhost:10001 http://localhost:10006/services; do
            for attempt in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 2; done
            curl -sf -o /dev/null "$url" || { echo "$url did not start"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm check
        working-directory: backend
      - run: pnpm test
        working-directory: backend

  e2e:
    name: frontend (check + e2e tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start test Postgres, QuickPizza and the SOAP demo
        run: |
          docker compose -p perf-test --profile test up -d --wait postgres-test
          docker compose up -d quickpizza soap-demo
          for url in http://localhost:10001 http://localhost:10006/services; do
            for attempt in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 2; done
            curl -sf -o /dev/null "$url" || { echo "$url did not start"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  ci:
    name: ci
    # Not for runs cancelled by a newer push; their result does not matter.
    if: ${{ !cancelled() }}
    needs: [backend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          BACKEND: ${{ needs.backend.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "backend: $BACKEND, e2e: $E2E"
          [ "$BACKEND" = success ] && [ "$E2E" = success ]
