# Local stack: target APIs (QuickPizza, SOAP demo), Postgres, backend (runs k6), frontend.
# Every host port is an env var so parallel stacks can pick other ports.
services:
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:0.15.31
    ports:
      - "127.0.0.1:${QUICKPIZZA_PORT:-10001}:3333"
    restart: unless-stopped

  # SOAP target for the SOAP example flow: Learn Web Services (SayHello, temperature converter).
  soap-demo:
    image: vicziani/lwsapp:3.0.1
    ports:
      - "127.0.0.1:${SOAP_DEMO_PORT:-10006}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
      POSTGRES_DB: perf
    ports:
      # Postgres and the backend have no authentication of their own: bind them to this machine.
      # The frontend proxies /api, so other devices only need port FRONTEND_PORT.
      - "127.0.0.1:${POSTGRES_PORT:-10002}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d perf"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Throwaway Postgres for the backend integration tests: data lives in memory only.
  # Start with `pnpm test:db` (fixed project name perf-test: one instance shared by all worktrees).
  postgres-test:
    image: postgres:18-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
      POSTGRES_DB: perf
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-10005}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d perf"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://perf:perf@postgres:5432/perf
      DEFAULT_BASE_URL: http://quickpizza:3333
      SOAP_EXAMPLE_BASE_URL: http://soap-demo:8080
      # Set to false when people who must not load-test your own network can reach Bencho.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-10003}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      quickpizza:
        condition: service_started
      soap-demo:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-10004}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
